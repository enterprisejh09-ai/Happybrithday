<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
body{
  margin:0;
  font-family:sans-serif;
  background:#1a0f1f;
  color:white;
  text-align:center;
}

.card{
  max-width:700px;
  margin:40px auto;
  padding:20px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:20px;
  background:#ff4f88;
  color:white;
  cursor:pointer;
}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:10px;
  margin-top:20px;
}

.gallery img{
  width:100%;
  border-radius:10px;
}

.gallery-fallback{
  background:#333;
  padding:20px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">
  <div id="screen"></div>
</div>

<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const screen = document.getElementById("screen");
const music = document.getElementById("music");

const loginUsername = "Jahid";
const loginPassword = "24235142";

const memoryPhotos = [
  "./photo1.jpg",
  "./photo2.jpg",
  "./photo3.jpg",
  "./photo4.jpg",
  "./photo5.jpg"
];

// 🔥 FIX cache
function getFresh(src){
  return src + "?v=" + new Date().getTime();
}

// LOGIN PAGE
function renderLogin(){
  screen.innerHTML = `
    <h2>Login</h2>
    <input id="user" placeholder="Username"><br><br>
    <input id="pass" type="password" placeholder="Password"><br><br>
    <button onclick="checkLogin()">Open</button>
    <p id="msg"></p>
  `;
}

function checkLogin(){
  const u = document.getElementById("user").value;
  const p = document.getElementById("pass").value;

  if(u===loginUsername && p===loginPassword){
    renderIntro();
  }else{
    document.getElementById("msg").innerText="Wrong login!";
  }
}

// INTRO
function renderIntro(){
  screen.innerHTML = `
    <h1>Happy Birthday 🎉</h1>
    <p>Click to start your surprise</p>
    <button onclick="renderStory()">Start</button>
  `;
}

// STORY
function renderStory(){
  screen.innerHTML = `
    <h2>You are special ❤️</h2>
    <button onclick="playMusicAndContinue()">Continue</button>
  `;
}

// MUSIC FIX
function playMusicAndContinue(){
  music.currentTime = 0;

  music.play().then(()=>{
    console.log("music started");
  }).catch(()=>{
    alert("Tap again to enable music 🎵");
  });

  renderGallery();
}

// GLOBAL CLICK FIX
document.body.addEventListener("click", ()=>{
  music.play().catch(()=>{});
},{once:true});

// GALLERY
function renderGallery(){
  const gallery = memoryPhotos.map((p,i)=>`
    <div>
      <img src="${getFresh(p)}"
      onerror="this.outerHTML='<div class=gallery-fallback>Missing ${p}</div>'">
    </div>
  `).join("");

  screen.innerHTML = `
    <h2>Memories 💖</h2>
    <div class="gallery">${gallery}</div>
    <br>
    <button onclick="finalPage()">Final Surprise</button>
  `;
}

// FINAL
function finalPage(){
  screen.innerHTML = `
    <h2>Final Message 💝</h2>
    <img src="./her-photo.jpg" style="width:200px;border-radius:10px"
    onerror="this.outerHTML='<div class=gallery-fallback>Add her-photo.jpg</div>'">
    <p>You are amazing. Happy Birthday 🎂</p>
  `;
}

// START
renderLogin();
</script>

</body>
</html>
